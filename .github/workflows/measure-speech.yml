name: Measure speech accuracy

# Runs bench/asr/fleurs/measure.py for every (model, language) pair plan.py says is missing or stale,
# one job per pair, then the collect job merges the results, writes the accuracy blocks and opens a PR
# against the branch the run was on. Runs on a catalogue or harness change on main, on a push to a
# measure/** branch, or on dispatch with model ids. The paths filter applies to both branches (push
# has one filter); dispatch covers anything else.
on:
  push:
    branches: [main, "measure/**"]
    paths:
      - catalog/speech.yaml
      - bench/asr/fleurs/**
  workflow_dispatch:
    inputs:
      models:
        description: Model ids separated by spaces (blank for every model)
        required: false
        default: ""

permissions:
  contents: read

# A run takes hours; a later push queues behind it and never cancels it.
concurrency:
  group: measure-speech-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          MODELS: ${{ inputs.models }}
        run: |
          pip install -q pyyaml==6.0.3
          matrix="$(python3 bench/asr/fleurs/plan.py --json $MODELS)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "empty=$([ "$(echo "$matrix" | jq '.include | length')" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.include[] | "\(.model) \(.lang)"'

  measure:
    needs: plan
    if: needs.plan.outputs.empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.model }} ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Measure
        env:
          BENCH_CACHE: ${{ runner.temp }}/fleurs
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q -r bench/asr/fleurs/requirements.txt
          python bench/asr/fleurs/measure.py "${{ matrix.model }}" "${{ matrix.lang }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleurs-${{ matrix.model }}-${{ matrix.lang }}
          path: bench/asr/fleurs/results/${{ matrix.model }}.json
          retention-days: 30

  collect:
    needs: [plan, measure]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Every job that failed simply has no artifact; report.py lists those pairs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: fleurs-*
          path: ${{ runner.temp }}/fleurs-artifacts
      - name: Collect, generate and validate
        id: collect
        env:
          ARTIFACTS: ${{ runner.temp }}/fleurs-artifacts
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          mkdir -p "$ARTIFACTS"
          python -m pip install -e '.[dev]'
          python bench/asr/fleurs/collect.py "$ARTIFACTS"
          scribekey-models generate
          echo "$MATRIX" > "$RUNNER_TEMP/plan.json"
          if scribekey-models validate > "$RUNNER_TEMP/validate.txt" 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            python bench/asr/fleurs/report.py "$RUNNER_TEMP/plan.json" "$ARTIFACTS" > "$RUNNER_TEMP/body.md"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            python bench/asr/fleurs/report.py "$RUNNER_TEMP/plan.json" "$ARTIFACTS" "$RUNNER_TEMP/validate.txt" > "$RUNNER_TEMP/body.md"
          fi
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      # The branch must not match measure/**, or the PR's own push would start another run.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: ${{ github.ref_name }}
          branch: accuracy/${{ github.ref_name }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "feat(speech): measured FLEURS accuracy for ${{ github.ref_name }}"
          commit-message: "feat(speech): measured FLEURS accuracy for ${{ github.ref_name }}"
          body-path: ${{ runner.temp }}/body.md
          add-paths: |
            bench/asr/fleurs/results
            catalog/speech.yaml
            generated
          labels: |
            distribution
      - name: Fail when validate failed
        if: steps.collect.outputs.valid == 'false'
        run: |
          cat "$RUNNER_TEMP/validate.txt"
          exit 1
