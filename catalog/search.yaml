schema_version: 1
# Embedding models behind Search by meaning. Each turns a passage or a query into one vector; the app
# stores passage vectors and ranks them against the query's. Decided in app issues #1183-#1185.
models:
  # Not measured on a phone by ScribeKey yet and not through any quality bar, so experimental.
  # Licence: the litert-community card's metadata says apache-2.0 and the repo has no LICENSE file.
  # The base card (licenseUrl, pinned) labels its licence "Apache 2.0", linking
  # https://ai.google.dev/gemma/docs/gemma_4_license (plain Apache 2.0 text), and also says
  # "Deployments must adhere to the Gemma Prohibited Use Policy"
  # (https://ai.google.dev/gemma/prohibited_use_policy). Whether that binds ScribeKey is the owner's call.
  - modelId: embeddinggemma-2-text-270m
    displayName: EmbeddingGemma 2
    description: Finds sessions by what they mean, not only the words in them. Runs on your phone.
    bestFor: Search by meaning
    experimental: true
    badge: Experimental
    info:
      paramsBadge: 270M
      architecture: EmbeddingGemma 2 Text
      languages: English
    provenance:
      sourceModel: google/embeddinggemma-2
      exportRepository: litert-community/embeddinggemma-2-text-270m-litert-lm
      exportRevision: 9be6e8b90982095dc05c2bd162e4b954ee4dbac7
      exportVariant: int4 QAT LiteRT-LM, CPU/GPU file
      licenseId: Apache-2.0
      licenseUrl: https://huggingface.co/google/embeddinggemma-2/blob/f9972ac22e696a105c482202646979e33e4b5a1e/README.md
    revision: 9be6e8b90982095dc05c2bd162e4b954ee4dbac7
    bundleFileName: embeddinggemma-2-text-270m.litertlm
    downloadUrl: https://huggingface.co/litert-community/embeddinggemma-2-text-270m-litert-lm/resolve/9be6e8b90982095dc05c2bd162e4b954ee4dbac7/embeddinggemma-2-text-270m.litertlm
    sizeBytes: 164626432
    sha256: 2d079ee2f6f066b1f368e8d7c819f55214eaef1d0513b312321901f30ab286fb
    runtimeFamily: litert-lm
    # The repo's per-SoC NPU files are left out until the app can pick one (#1185).
    backends: [cpu]
    # 6 GB, the floor cleanup uses for a model of similar size, until a phone run shows it fits in
    # less. The card reports 334 MB resident on CPU (S26 Ultra, 128-token input), not 256-token passages.
    minDeviceMemoryGb: 6
    minimumApiLevel: 28
    # LiteRT-LM ships no armeabi-v7a library (#1184).
    supportedAbis: [arm64-v8a, x86_64]
    # The card claims over 100 languages. This field says what ScribeKey supports, so English until
    # another is measured, as for notes.
    supportedLanguages: [en]
    embeddingDimensions: 256
    normalizeEmbeddings: true
    passageTokens: 256
    license: Apache-2.0
    attribution: EmbeddingGemma 2 by Google DeepMind, LiteRT-LM build from litert-community.
    licenseUrl: https://huggingface.co/google/embeddinggemma-2/blob/f9972ac22e696a105c482202646979e33e4b5a1e/README.md
    privacyDisclosure: Transcript text stays on this device.
